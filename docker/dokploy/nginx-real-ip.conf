# Mounted only by this folder's docker-compose.yml (Dokploy). Behind Traefik,
# $remote_addr is Traefik's address, so every visitor would share one API rate
# limit. Take the client address from the X-Forwarded-For that Traefik sets.
#
# Safe only with Dokploy's Isolated Deployments on and no published port: then
# only Traefik, app and postgres share a network with nginx. Traefik drops client-sent
# X-Forwarded-* headers unless its entrypoint sets forwardedHeaders.insecure
# or trustedIPs, so keep those off. Without real_ip_recursive, nginx uses the
# rightmost address, the one Traefik wrote.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
