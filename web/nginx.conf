server {
    listen 8080;

    # Browsers share cookies across every localhost port, so other local apps'
    # cookies can exceed nginx's default 8k header buffer (400 "Request Header
    # Or Cookie Too Large").
    large_client_header_buffers 4 32k;

    # Inherited by every location below (none sets its own add_header).
    # ponytail: no CSP yet; SvelteKit's kit.csp hashes are the upgrade path.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Nothing lives at the bare root; send visitors to the SPA.
    location = / {
        return 302 /app/;
    }

    # The SPA. Unknown /app/* paths fall back to index.html for client routing.
    location = /app {
        return 301 /app/;
    }
    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
    }

    # Everything else is the API: /api/* and the GET /:shortCode redirect.
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        # Overwrite, never append: the API trusts private hops (configure-app.ts),
        # so a client-supplied X-Forwarded-For would let private-address clients
        # (e.g. everyone behind Docker Desktop's NAT) pick their own rate-limit key.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API is token-based and never reads cookies; dropping them keeps
        # stray localhost cookies from tripping Node's 16k header limit (431).
        proxy_set_header Cookie "";
    }
}
