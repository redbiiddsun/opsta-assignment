services:
  app:
    build: .
    # .env.example gives working local defaults so a fresh clone runs with one
    # command; a real .env, when present, overrides it.
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is the service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-url_shortener}?schema=public
      PORT: 3000
    # Localhost only: outside callers must go through `web` (nginx), which sets
    # X-Forwarded-For. Reached directly, a private-address client could spoof
    # its IP and dodge the rate limits (see configure-app.ts).
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres:
        # Migrations run on start, so wait until Postgres accepts connections.
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    # nginx: /app/* is the SvelteKit SPA, everything else is proxied to `app`.
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      # Defaults match .env.example; compose reads ${...} from .env only.
      POSTGRES_USER: ${POSTGRES_USER:-url_shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
    # Localhost only: the defaults are well-known placeholder credentials.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
